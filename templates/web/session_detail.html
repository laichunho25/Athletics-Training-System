{% extends "base.html" %}
{% load static %}
{% block title %}{{ s.title }}{% endblock %}

{% block content %}
<div class="between mb">
  <div>
    <h1>課表</h1>
    <div class="subtitle" style="margin:0">
      有底線的欄位點一下就能改；改完會即時同步到日曆與其他人的畫面。
    </div>
  </div>
  <a class="btn ghost sm" href="{% url 'web:calendar' %}?athlete={{ s.athlete.id }}&year={{ s.date.year }}&month={{ s.date.month }}">← 回日曆</a>
</div>

<div id="live" data-version="{{ version }}" data-live-url="{% url 'web:session_live' s.id %}">
  {% include "web/_session_body.html" %}
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/liveedit.js' %}"></script>
<script>
  ATM.mountSession();
</script>
{% endblock %}
