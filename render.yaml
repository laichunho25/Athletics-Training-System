# Render Blueprint — 一鍵建立 Web Service + PostgreSQL
# 用法：Render Dashboard → New → Blueprint → 選這個 repo
services:
  - type: web
    name: atm-athletics
    runtime: python
    plan: starter          # free 方案會休眠且無持久磁碟；正式網域建議 starter 以上
    region: singapore      # 香港使用者延遲最低
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 120"
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render 自動產生亂數金鑰
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "www.hohosports.com,hohosports.com"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: atm-db
          property: connectionString

databases:
  - name: atm-db
    plan: basic-256mb      # free 方案 30 天後過期，正式站請用付費方案
    region: singapore
    databaseName: atm
    user: atm
